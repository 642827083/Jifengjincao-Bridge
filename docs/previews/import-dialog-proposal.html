<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>导入界面优化方案预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#23313b;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}main{width:min(1120px,calc(100% - 40px));margin:24px auto}.caption{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}.caption strong{font-size:20px;font-weight:600}.caption span{font-size:12px;color:#79828a}.panel{height:608px;position:relative;overflow:hidden;background:#fafbfd;border:1px solid #d9dfe4;border-radius:10px;box-shadow:0 10px 34px #22334412}.native{height:36px;position:relative;display:flex;align-items:center;justify-content:center;color:#666;font-size:13px;background:#fbfbfc;border-bottom:1px solid #e8e8e8}.native button{position:absolute;inset:0 0 auto auto;width:44px;height:36px;border:0;background:transparent;font-size:20px;color:#666}.brand{display:flex;align-items:center;justify-content:space-between;padding:20px 30px;border-bottom:1px solid #e6e9ed}.brand strong{font-size:25px;color:#252a2d}.brand span{color:#4b5560;word-spacing:20px}.paper{padding:20px 32px}.paper h1{margin:0 0 16px;font-size:26px}.placeholder{background:white;border:1px solid #e3e6eb;border-radius:14px;padding:24px;height:320px;font-size:18px}.placeholder p{color:#657280}.scrim{position:absolute;inset:36px 0 0;background:#17212f45;display:flex;align-items:center;justify-content:center;padding:18px}.sheet{display:flex;flex-direction:column;width:min(720px,100%);height:min(520px,100%);min-height:0;border-radius:16px;background:white;box-shadow:0 16px 60px #13243828;overflow:hidden}.sheet header{padding:16px 24px 12px;display:flex;align-items:center;justify-content:space-between}.sheet h2{font-size:20px;font-weight:600;margin:0}.close{border:0;background:transparent;font-size:21px;color:#89929a;padding:0 2px}.meta{display:flex;align-items:center;gap:24px;padding:0 24px 12px;font-size:13px}.meta span{color:#86909b;margin-right:8px}.meta b{font-weight:500}.settings{display:flex;align-items:center;gap:14px;padding:12px 24px;background:#fafbfc;border-top:1px solid #edf0f2;border-bottom:1px solid #edf0f2}.settings>span{font-size:13px;color:#7b8793}.segments{display:flex;padding:3px;gap:3px;border-radius:8px;background:#edf0f3}.segments button{border:0;border-radius:6px;padding:5px 12px;background:transparent;font-size:13px;color:#677580}.segments button.active{background:white;color:#1c5eae;box-shadow:0 1px 4px #213c5314}.selectbar{display:flex;align-items:center;padding:12px 24px 8px;gap:14px;font-size:12px;color:#919ba6}.selectbar button{border:0;background:transparent;padding:0;color:#2564ac;font-size:13px}.selectbar small{margin-left:auto;font-size:12px}.list{flex:1;min-height:0;overflow-y:auto;padding:0 12px 8px;scrollbar-width:thin}.row{display:flex;align-items:flex-start;gap:12px;margin:0 0 2px;padding:13px 12px;border-radius:9px;cursor:pointer}.row.selected{background:#edf5ff}.row input{appearance:none;flex:0 0 20px;width:20px;height:20px;margin:2px 0 0;border:1.5px solid #c7d0d8;border-radius:5px;position:relative}.row input:checked{background:#2467b8;border-color:#2467b8}.row input:checked:after{content:'✓';position:absolute;inset:-2px 0 0;text-align:center;color:white;font-size:16px}.rowbody{flex:1;min-width:0}.rowtitle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}.badge{font-size:11px;color:#7b8793;font-weight:400}.excerpt{font-size:13px;color:#677680;line-height:1.8;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.math{font-family:"Cambria Math","Times New Roman",serif;font-style:italic;color:#394f5e;font-size:15px}.rowbody>a{float:right;font-size:12px;color:#2467b8;text-decoration:none;margin-left:14px}.sheet footer{flex-shrink:0;display:flex;align-items:center;gap:10px;min-height:68px;border-top:1px solid #e9edf2;padding:12px 24px;background:white}.count{margin-right:auto;color:#81909b;font-size:13px}.count b{color:#2467b8;font-weight:600}.cancel,.commit{border-radius:8px;padding:8px 17px;border:1px solid #d9e0e7;background:white;color:#5b6976;font-size:14px}.commit{background:#2263b4;border-color:#2263b4;color:white;min-width:106px}.commit:disabled{opacity:.4;cursor:default}.footnote{margin:14px 0;color:#7e8892;font-size:12px}.sheet header,.meta,.settings,.selectbar{flex-shrink:0}@media(max-width:620px){main{width:calc(100% - 24px);margin:12px auto}.caption{gap:6px;flex-wrap:wrap}.caption strong{font-size:18px}.panel{height:650px}.scrim{padding:12px}.sheet header{padding:14px 16px 10px}.meta{padding:0 16px 10px;gap:4px;align-items:flex-start;flex-direction:column}.settings{padding:10px 16px;gap:8px;flex-wrap:wrap}.selectbar{padding:10px 16px 6px}.list{padding:0 6px 6px}.sheet footer{padding:12px 16px;gap:8px}.cancel,.commit{padding:8px 12px}.brand span{display:none}.count{font-size:12px}.segments button{padding:5px 10px}}
</style>
</head>
<body><main>
<div class="caption"><strong>导入界面优化方案</strong><span>独立预览 · 待确认实施</span></div>
<div class="panel">
<div class="native">Jifengjincao Bridge<button aria-label="关闭插件">×</button></div>
<div class="brand"><strong>疾风劲草</strong><span>套卷　 分类题库　 题篮</span></div>
<div class="paper"><h1>张宇四套卷 · 卷二</h1><div class="placeholder"><b>第 02 题</b><p>已知数列 {xₙ}，给出下列命题……</p></div></div>
<div class="scrim"><section class="sheet" role="dialog" aria-label="导入题目">
<header><h2>导入题目</h2><button class="close" aria-label="关闭导入">×</button></header>
<div class="meta"><div><span>来源</span><b>张宇四套卷 · 卷二</b></div><div><span>目标学习集</span><b>数学</b></div></div>
<div class="settings"><span>导入内容</span><div class="segments" role="group" aria-label="导入内容"><button class="active" type="button" aria-pressed="true">仅题目</button><button type="button" aria-pressed="false">题目＋答案解析</button></div></div>
<div class="selectbar"><button type="button" data-select="all">全选</button><button type="button" data-select="none">清空</button><small>示意列表 · 共 5 题</small></div>
<div class="list">
<label class="row"><input aria-label="第5题" type="checkbox"><div class="rowbody"><div class="rowtitle">第 5 题 <span class="badge">选择题</span></div><div class="excerpt">一个直径为 20 m 的倒圆锥形水池，深 4 m，水密度为 ρ，重力加速度为 g。若将盛满的水全部抽出，至少需做多少功？</div></div></label>
<label class="row selected"><input aria-label="第6题" type="checkbox" checked><div class="rowbody"><div class="rowtitle">第 6 题 <span class="badge">选择题</span></div><div class="excerpt">设 <span class="math">z = z(x, y)</span> 是由方程 <span class="math">∫<sub>2x−3y</sub><sup>z</sup> f(2x−3y+z−t) dt = sin(2x−3y+z)</span> 所确定的函数，其中 f 为连续函数，则（　）</div></div></label>
<label class="row"><input aria-label="第7题" type="checkbox"><div class="rowbody"><div class="rowtitle">第 7 题 <span class="badge">选择题</span></div><div class="excerpt">设 a 与 b 都是常数，若反常积分 <span class="math">∫<sub>0</sub><sup>+∞</sup> [x<sup>a</sup>(1−e<sup>−x</sup>)] / (1+x)<sup>b</sup> dx</span> 收敛，则 a 与 b 的取值范围为（　）</div></div></label>
<label class="row"><input aria-label="第8题" type="checkbox"><div class="rowbody"><div class="rowtitle">第 8 题 <span class="badge">填空题</span></div><div class="excerpt">设函数 f 在区间 [0, 1] 上连续，求所给定积分的值。</div></div></label>
<label class="row"><input aria-label="第9题" type="checkbox"><div class="rowbody"><div class="rowtitle">第 9 题 <span class="badge">解答题</span></div><div class="excerpt">证明所给函数满足条件，并写出完整的计算过程。</div></div></label>
</div>
<footer><div class="count">已选 <b id="selected-count">1</b> / 5 题</div><button class="cancel" type="button">取消</button><button class="commit" type="button">导入 1 题</button></footer>
</section></div></div>
<p class="footnote">预览只演示排版、选择与滚动，不连接网站或执行导入。上方为本轮修改后的 36px 标题栏示意。</p>
</main>
<script>
// 仅演示界面状态，不发送命令或保存用户数据。
function update(){const inputs=Array.from(document.querySelectorAll('.list input'));const count=inputs.filter(input=>input.checked).length;inputs.forEach(input=>input.closest('.row').classList.toggle('selected',input.checked));document.getElementById('selected-count').textContent=count;const commit=document.querySelector('.commit');commit.textContent='导入 '+count+' 题';commit.disabled=count===0;}
document.querySelector('.list').addEventListener('change',update);
document.querySelectorAll('[data-select]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.list input').forEach(input=>input.checked=button.dataset.select==='all');update();}));
document.querySelectorAll('.segments button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.segments button').forEach(option=>{option.classList.toggle('active',option===button);option.setAttribute('aria-pressed',String(option===button));});}));
</script></body></html>
